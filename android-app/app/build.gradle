plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barisnow.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.barisnow.app'
        minSdk 23
        targetSdk 36
        versionCode 28
        versionName '1.4.16'

        // Ubicaciones de app y widgets gestionadas de manera independiente desde 1.4.4.
        // BariSnow 1.4.16 implementa el widget premium 5x5 aprobado.
        // AdMob queda preparado pero desactivado hasta cargar IDs reales y consentimiento.
        buildConfigField 'boolean', 'ADS_ENABLED', 'false'
        buildConfigField 'String', 'ADMOB_BANNER_ID', '""'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
