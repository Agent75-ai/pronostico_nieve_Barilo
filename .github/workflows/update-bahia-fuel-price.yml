name: Update Bahía Blanca fuel price

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'viaje-bahia-blanca/scripts/update_fuel_price.py'
      - '.github/workflows/update-bahia-fuel-price.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate national average for Nafta súper
        run: python viaje-bahia-blanca/scripts/update_fuel_price.py
      - name: Commit updated market price
        run: |
          if git diff --quiet -- viaje-bahia-blanca/fuel-price.json; then
            echo 'No fuel price changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viaje-bahia-blanca/fuel-price.json
          git commit -m 'Update market average for Nafta super'
          git push
