name: NovelVoice Android free build

on:
  push:
    branches: [ "build/novelvoice-0.3.0" ]
    paths:
      - "NovelVoiceBuildSrc/**"
      - ".github/workflows/novelvoice-temp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct NovelVoice source
        shell: bash
        run: |
          mkdir -p NovelVoiceBuild
          cat NovelVoiceBuildSrc/min_00.b64 NovelVoiceBuildSrc/min_01.b64 NovelVoiceBuildSrc/min_02.b64 NovelVoiceBuildSrc/min_03.b64 NovelVoiceBuildSrc/min_04.b64 NovelVoiceBuildSrc/min_05.b64 NovelVoiceBuildSrc/min_06.b64 NovelVoiceBuildSrc/p07a.txt NovelVoiceBuildSrc/p07b.txt > /tmp/novelvoice.b64
          python - <<'PY'
          from pathlib import Path
          h = Path('NovelVoiceBuildSrc/p08.hex').read_text().strip()
          with Path('/tmp/novelvoice.b64').open('a') as f:
              f.write(bytes.fromhex(h).decode('ascii'))
          PY
          tr -d '\n' < /tmp/novelvoice.b64 | base64 -d > /tmp/novelvoice.tgz
          tar -xzf /tmp/novelvoice.tgz -C NovelVoiceBuild
          cp NovelVoiceBuildSrc/app-build-fixed.gradle.kts NovelVoiceBuild/app/build.gradle.kts
          sed -i '/import androidx.compose.foundation.layout.weight/d' NovelVoiceBuild/app/src/main/java/com/praxys/novelvoice/MainActivity.kt
          test -f NovelVoiceBuild/app/build.gradle.kts
          test -f NovelVoiceBuild/app/src/main/java/com/praxys/novelvoice/tts/LocalTtsEngine.kt
          ! grep -R "xi-api-key\|ElevenLabsClient\|permission.INTERNET" NovelVoiceBuild/app/src/main NovelVoiceBuild/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle -p NovelVoiceBuild :app:testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle -p NovelVoiceBuild :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelVoice-Android-0.3.0
          path: NovelVoiceBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
