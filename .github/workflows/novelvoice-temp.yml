name: NovelVoice Android Piper build

on:
  push:
    branches: [ "build/novelvoice-0.4.0" ]
    paths:
      - "NovelVoiceBuildSrc/v040_*.b64"
      - ".github/workflows/novelvoice-temp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct NovelVoice 0.4 source
        shell: bash
        run: |
          cat NovelVoiceBuildSrc/v040_00.b64 NovelVoiceBuildSrc/v040_01.b64 NovelVoiceBuildSrc/v040_02.b64 NovelVoiceBuildSrc/v040_03.b64 | tr -d '\n' | base64 -d > /tmp/novelvoice-v040.tgz
          mkdir -p /tmp/novelvoice-src NovelVoiceBuild
          tar -xzf /tmp/novelvoice-v040.tgz -C /tmp/novelvoice-src
          cp -a /tmp/novelvoice-src/NovelVoiceAndroid_v0.4.0/. NovelVoiceBuild/
          test -f NovelVoiceBuild/app/src/main/java/com/praxys/novelvoice/tts/PiperTtsEngine.kt
          test -x NovelVoiceBuild/prepare_piper.sh
          ! grep -R "xi-api-key\|ElevenLabsClient\|android.permission.INTERNET" NovelVoiceBuild/app/src/main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download free Piper runtime and Daniela model
        run: NovelVoiceBuild/prepare_piper.sh

      - name: Verify neural model inputs
        shell: bash
        run: |
          test -s NovelVoiceBuild/app/libs/sherpa-onnx-1.13.5.aar
          test -s NovelVoiceBuild/app/src/main/assets/vits-piper-es_AR-daniela-high/es_AR-daniela-high.onnx
          test -s NovelVoiceBuild/app/src/main/assets/vits-piper-es_AR-daniela-high/tokens.txt
          test -d NovelVoiceBuild/app/src/main/assets/vits-piper-es_AR-daniela-high/espeak-ng-data

      - name: Unit tests
        run: gradle -p NovelVoiceBuild :app:testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle -p NovelVoiceBuild :app:assembleDebug --stacktrace

      - name: Verify APK contains Piper and arm64 runtime
        shell: bash
        run: |
          APK=NovelVoiceBuild/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep "assets/vits-piper-es_AR-daniela-high/es_AR-daniela-high.onnx"
          unzip -l "$APK" | grep "assets/vits-piper-es_AR-daniela-high/tokens.txt"
          unzip -l "$APK" | grep "lib/arm64-v8a/.*sherpa"
          ! unzip -l "$APK" | grep "lib/x86"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelVoice-Android-0.4.0-Piper
          path: NovelVoiceBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
