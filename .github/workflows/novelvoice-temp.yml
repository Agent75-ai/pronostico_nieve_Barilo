name: NovelVoice Android Piper build

on:
  push:
    branches: [ "build/novelvoice-0.4.0" ]
    paths:
      - "NovelVoiceBuildSrc/v040patch_*.b64"
      - "NovelVoiceBuildSrc/app-build-v040.gradle.kts"
      - ".github/workflows/novelvoice-temp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct NovelVoice 0.3 base and apply 0.4 patch
        shell: bash
        run: |
          mkdir -p NovelVoiceBuild
          cat NovelVoiceBuildSrc/min_00.b64 NovelVoiceBuildSrc/min_01.b64 NovelVoiceBuildSrc/min_02.b64 NovelVoiceBuildSrc/min_03.b64 NovelVoiceBuildSrc/min_04.b64 NovelVoiceBuildSrc/min_05.b64 NovelVoiceBuildSrc/min_06.b64 NovelVoiceBuildSrc/p07a.txt NovelVoiceBuildSrc/p07b.txt > /tmp/novelvoice.b64
          python - <<'PY'
          from pathlib import Path
          h = Path('NovelVoiceBuildSrc/p08.hex').read_text().strip()
          with Path('/tmp/novelvoice.b64').open('a') as f:
              f.write(bytes.fromhex(h).decode('ascii'))
          PY
          tr -d '\n' < /tmp/novelvoice.b64 | base64 -d > /tmp/novelvoice-v030.tgz
          tar -xzf /tmp/novelvoice-v030.tgz -C NovelVoiceBuild
          cp NovelVoiceBuildSrc/app-build-fixed.gradle.kts NovelVoiceBuild/app/build.gradle.kts
          sed -i '/import androidx.compose.foundation.layout.weight/d' NovelVoiceBuild/app/src/main/java/com/praxys/novelvoice/MainActivity.kt

          cat NovelVoiceBuildSrc/v040patch_00.b64 NovelVoiceBuildSrc/v040patch_01.b64 NovelVoiceBuildSrc/v040patch_02.b64 NovelVoiceBuildSrc/v040patch_03.b64 NovelVoiceBuildSrc/v040patch_04.b64 | tr -d '\n' | base64 -d | gzip -dc > /tmp/v040.patch
          set +e
          (cd NovelVoiceBuild && patch --batch -p4 < /tmp/v040.patch)
          PATCH_STATUS=$?
          set -e
          cp NovelVoiceBuildSrc/app-build-v040.gradle.kts NovelVoiceBuild/app/build.gradle.kts
          rm -f NovelVoiceBuild/app/build.gradle.kts.rej
          if find NovelVoiceBuild -name '*.rej' -print -quit | grep -q .; then
            echo 'Unexpected patch reject:'
            find NovelVoiceBuild -name '*.rej' -print
            exit 1
          fi
          chmod +x NovelVoiceBuild/prepare_piper.sh

          test -f NovelVoiceBuild/app/src/main/java/com/praxys/novelvoice/tts/PiperTtsEngine.kt
          test -x NovelVoiceBuild/prepare_piper.sh
          grep -q 'versionName = "0.4.0"' NovelVoiceBuild/app/build.gradle.kts
          grep -q 'PiperTtsEngine' NovelVoiceBuild/app/src/main/java/com/praxys/novelvoice/MainViewModel.kt
          ! grep -R "xi-api-key\|ElevenLabsClient\|android.permission.INTERNET" NovelVoiceBuild/app/src/main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download free Piper runtime and Daniela model
        run: NovelVoiceBuild/prepare_piper.sh

      - name: Verify neural model inputs
        shell: bash
        run: |
          test -s NovelVoiceBuild/app/libs/sherpa-onnx-1.13.5.aar
          test -s NovelVoiceBuild/app/src/main/assets/vits-piper-es_AR-daniela-high/es_AR-daniela-high.onnx
          test -s NovelVoiceBuild/app/src/main/assets/vits-piper-es_AR-daniela-high/tokens.txt
          test -d NovelVoiceBuild/app/src/main/assets/vits-piper-es_AR-daniela-high/espeak-ng-data

      - name: Unit tests
        run: gradle -p NovelVoiceBuild :app:testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle -p NovelVoiceBuild :app:assembleDebug --stacktrace

      - name: Verify APK contains Piper and arm64 runtime
        shell: bash
        run: |
          APK=NovelVoiceBuild/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep "assets/vits-piper-es_AR-daniela-high/es_AR-daniela-high.onnx"
          unzip -l "$APK" | grep "assets/vits-piper-es_AR-daniela-high/tokens.txt"
          unzip -l "$APK" | grep "lib/arm64-v8a/.*sherpa"
          ! unzip -l "$APK" | grep "lib/x86"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelVoice-Android-0.4.0-Piper
          path: NovelVoiceBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
