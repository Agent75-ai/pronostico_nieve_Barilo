name: Build Viaje Bahía Blanca Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'viaje-bahia-blanca/android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viaje-bahia-blanca/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: viaje-bahia-blanca-debug-apk
          path: viaje-bahia-blanca/android/app/build/outputs/apk/debug/app-debug.apk
