name: Build BariSnow Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-novelvoice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nvparts
          for f in .novelvoice-src/part-*; do
            tr -d '[:space:]' < "$f" >> /tmp/novelvoice.b64
          done
          base64 -d /tmp/novelvoice.b64 > /tmp/NovelVoiceAndroid_v0.5.0-source.zip
          echo '29e0e5b98451f85a94ad4fd9635b8c34813d3a0dea94e8e59ba4b8faa9441136  /tmp/NovelVoiceAndroid_v0.5.0-source.zip' | sha256sum -c -
          rm -rf /tmp/nv && mkdir -p /tmp/nv
          unzip -q /tmp/NovelVoiceAndroid_v0.5.0-source.zip -d /tmp/nv
          cd /tmp/nv/NovelVoiceAndroid_v0.5.0
          sed -i 's/applicationId = "com.praxys.novelvoice"/applicationId = "com.praxys.novelvoice.full"/' app/build.gradle.kts
          sed -i 's/versionCode = 5/versionCode = 6/' app/build.gradle.kts
          sed -i 's/versionName = "0.5.0"/versionName = "0.5.0-full"/' app/build.gradle.kts
          grep -n 'applicationId\|versionCode\|versionName' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Piper and Daniela
        run: |
          cd /tmp/nv/NovelVoiceAndroid_v0.5.0
          bash prepare_piper.sh

      - name: Test
        run: |
          cd /tmp/nv/NovelVoiceAndroid_v0.5.0
          gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build APK
        run: |
          cd /tmp/nv/NovelVoiceAndroid_v0.5.0
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/nv/NovelVoiceAndroid_v0.5.0/app/build/outputs/apk/debug/app-debug.apk
          OUT=/tmp/NovelVoice-Android-0.5.0-Full-NoConflict.apk
          test -s "$SRC"
          cp "$SRC" "$OUT"
          unzip -l "$OUT" > /tmp/apk-list.txt
          grep -qi 'es_AR-daniela-high.onnx' /tmp/apk-list.txt
          grep -qiE 'libsherpa[-_]?onnx.*\.so|libsherpa.*\.so' /tmp/apk-list.txt
          sha256sum "$OUT"
          ls -lh "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelVoice-Android-0.5.0-Full-NoConflict
          path: /tmp/NovelVoice-Android-0.5.0-Full-NoConflict.apk
          if-no-files-found: error
          retention-days: 7
