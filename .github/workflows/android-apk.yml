name: Build BariSnow Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'precipitation-model.js'
      - 'precipitation-communication.js'
      - 'sw.js'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'precipitation-model.js'
      - 'precipitation-communication.js'
      - 'sw.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate precipitation JavaScript
        run: |
          node --check precipitation-model.js
          node --check precipitation-communication.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p android-app assembleDebug --no-daemon

      - name: Build release AAB
        run: gradle -p android-app bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BariSnow-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: BariSnow-Play-AAB-unsigned
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish APK to GitHub Pages source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP "versionName '\K[^']+" android-app/app/build.gradle)
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "downloads/BariSnow-Android-${VERSION_NAME}.apk"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/BariSnow-Android-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/
          if git diff --cached --quiet; then
            echo "APK sin cambios para publicar."
          else
            git commit -m "Publicar APK BariSnow ${VERSION_NAME}"
            git push origin HEAD:main
          fi
