name: Build BariSnow Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'precipitation-model.js'
      - 'precipitation-communication.js'
      - 'rain-interval-display.js'
      - 'current-sky-priority.js'
      - 'web-daynight-fix.js'
      - 'sw.js'
      - 'scripts/apply_widget_readability.py'
      - 'scripts/apply_widget_clean_4x4.py'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'precipitation-model.js'
      - 'precipitation-communication.js'
      - 'rain-interval-display.js'
      - 'current-sky-priority.js'
      - 'web-daynight-fix.js'
      - 'sw.js'
      - 'scripts/apply_widget_readability.py'
      - 'scripts/apply_widget_clean_4x4.py'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: barisnow-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply clean premium 4x4 widget design
        run: |
          python3 scripts/apply_widget_readability.py
          python3 scripts/apply_widget_clean_4x4.py

      - name: Validate precipitation JavaScript
        run: |
          node --check precipitation-model.js
          node --check precipitation-communication.js
          node --check rain-interval-display.js
          node --check current-sky-priority.js
          node --check web-daynight-fix.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p android-app assembleDebug --no-daemon

      - name: Build release AAB
        run: gradle -p android-app bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BariSnow-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: BariSnow-Play-AAB-unsigned
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish APK and corrected sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP "versionName '\K[^']+" android-app/app/build.gradle)
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "downloads/BariSnow-Android-${VERSION_NAME}.apk"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/BariSnow-Android-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ \
            scripts/apply_widget_readability.py \
            scripts/apply_widget_clean_4x4.py \
            precipitation-communication.js \
            rain-interval-display.js \
            sw.js \
            android-app/app/build.gradle \
            android-app/app/src/main/java/com/barisnow/app/BariSnowWidgetProvider.java \
            android-app/app/src/main/java/com/barisnow/app/BariSnowCompactWidgetProvider.java \
            android-app/app/src/main/java/com/barisnow/app/BariSnowRainEngine.java \
            android-app/app/src/main/java/com/barisnow/app/BariSnowForecastEngine.java \
            android-app/app/src/main/java/com/barisnow/app/BariSnowWeatherClient.java \
            android-app/app/src/main/res/layout/widget_barisnow.xml \
            android-app/app/src/main/res/layout/widget_barisnow_compact.xml \
            android-app/app/src/main/res/layout/widget_barisnow_daily.xml \
            android-app/app/src/main/res/xml/barisnow_widget_info.xml \
            android-app/app/src/main/res/drawable/widget_hour_panel.xml \
            android-app/app/src/main/res/drawable/widget_day_panel.xml
          if git diff --cached --quiet; then
            echo "Fuentes y APK sin cambios para publicar."
          else
            git commit -m "Publicar BariSnow ${VERSION_NAME} con widget limpio 4x4"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
