name: NovelVoice 0.5 Full APK

on:
  push:
    branches:
      - novelvoice-build-0.5
    paths:
      - '.novelvoice-src/**'
      - '.github/workflows/novelvoice-0.5-full-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct NovelVoice source
        shell: bash
        run: |
          set -euo pipefail
          cat .novelvoice-src/part-* > /tmp/novelvoice.b64
          base64 -d /tmp/novelvoice.b64 > /tmp/NovelVoiceAndroid_v0.5.0-source.zip
          echo '29e0e5b98451f85a94ad4fd9635b8c34813d3a0dea94e8e59ba4b8faa9441136  /tmp/NovelVoiceAndroid_v0.5.0-source.zip' | sha256sum -c -
          rm -rf /tmp/nv
          mkdir -p /tmp/nv
          unzip -q /tmp/NovelVoiceAndroid_v0.5.0-source.zip -d /tmp/nv

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare bundled Piper runtime and Daniela voice
        shell: bash
        run: |
          cd /tmp/nv/NovelVoiceAndroid_v0.5.0
          bash prepare_piper.sh

      - name: Run unit tests
        shell: bash
        run: |
          cd /tmp/nv/NovelVoiceAndroid_v0.5.0
          gradle :app:testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        shell: bash
        run: |
          cd /tmp/nv/NovelVoiceAndroid_v0.5.0
          gradle :app:assembleDebug --stacktrace

      - name: Verify full APK contents
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/nv/NovelVoiceAndroid_v0.5.0/app/build/outputs/apk/debug/app-debug.apk
          OUT=/tmp/NovelVoice-Android-0.5.0-Full.apk
          test -s "$SRC"
          cp "$SRC" "$OUT"
          unzip -l "$OUT" | grep -q 'es_AR-daniela-high.onnx'
          unzip -l "$OUT" | grep -q 'libSherpaOnnxJNI.so'
          sha256sum "$OUT"
          ls -lh "$OUT"

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelVoice-Android-0.5.0-Full
          path: /tmp/NovelVoice-Android-0.5.0-Full.apk
          if-no-files-found: error
          retention-days: 7
